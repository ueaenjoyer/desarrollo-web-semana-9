{% extends "base.html" %}

{% block title %}{{ accion }} Producto - Admin TechByte{% endblock %}

{% block content %}
<h1>{% if accion == "Agregar" %}➕{% else %}✏️{% endif %} {{ accion }} Producto</h1>

<form method="POST" class="crud-form"
    action="{% if accion == 'Editar' %}{{ url_for('admin_producto_editar', id=producto.id) }}{% else %}{{ url_for('admin_producto_agregar') }}{% endif %}">

    <div class="form-group">
        <label for="nombre">📝 Nombre del Producto *</label>
        <input type="text" id="nombre" name="nombre" required
            value="{{ producto.nombre if producto else '' }}"
            placeholder="Ej: MacBook Pro 16 M3">
    </div>

    <div class="form-group">
        <label for="id_categoria">📂 Categoría *</label>
        <select id="id_categoria" name="id_categoria" required>
            <option value="">-- Seleccionar categoría --</option>
            {% for cat in categorias %}
            <option value="{{ cat.id }}" {% if producto and producto.id_categoria == cat.id %}selected{% endif %}>
                {{ cat.nombre }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="precio">💰 Precio ($) *</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0" required
                value="{{ producto.precio if producto else '' }}" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="stock">📦 Stock *</label>
            <input type="number" id="stock" name="stock" min="0" required
                value="{{ producto.stock if producto else '' }}" placeholder="0">
        </div>
    </div>

    <div class="form-group">
        <label for="descripcion">📄 Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="4"
            placeholder="Describe las características del producto...">{{ producto.descripcion if producto else '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-save">
            {% if accion == "Agregar" %}➕ Agregar Producto{% else %}💾 Guardar Cambios{% endif %}
        </button>
        <a href="{{ url_for('admin_productos') }}" class="btn btn-cancel">❌ Cancelar</a>
    </div>
</form>
{% endblock %}
