{% extends "base.html" %}

{% block title %}{{ accion }} Categoría - Admin TechByte{% endblock %}

{% block content %}
<h1>{% if accion == "Agregar" %}➕{% else %}✏️{% endif %} {{ accion }} Categoría</h1>

<form method="POST" class="crud-form"
    action="{% if accion == 'Editar' %}{{ url_for('admin_categoria_editar', id=categoria.id) }}{% else %}{{ url_for('admin_categoria_agregar') }}{% endif %}">

    <div class="form-group">
        <label for="nombre">📝 Nombre de la Categoría *</label>
        <input type="text" id="nombre" name="nombre" required
            value="{{ categoria.nombre if categoria else '' }}"
            placeholder="Ej: Laptops">
    </div>

    <div class="form-group">
        <label for="descripcion">📄 Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="3"
            placeholder="Describe la categoría...">{{ categoria.descripcion if categoria else '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-save">
            {% if accion == "Agregar" %}➕ Agregar Categoría{% else %}💾 Guardar Cambios{% endif %}
        </button>
        <a href="{{ url_for('admin_categorias') }}" class="btn btn-cancel">❌ Cancelar</a>
    </div>
</form>
{% endblock %}
