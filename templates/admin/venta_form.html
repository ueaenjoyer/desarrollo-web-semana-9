{% extends "base.html" %}

{% block title %}Registrar Venta - Admin TechByte{% endblock %}

{% block content %}
<h1>🛒 Registrar Venta</h1>

<form method="POST" action="{{ url_for('admin_venta_registrar') }}" class="crud-form">

    <div class="form-group">
        <label for="id_producto">📦 Producto *</label>
        <select id="id_producto" name="id_producto" required>
            <option value="">-- Seleccionar producto --</option>
            {% for p in productos %}
            <option value="{{ p.id }}" {% if p.stock <= 0 %}disabled{% endif %}>
                {{ p.nombre }} - ${{ "%.2f"|format(p.precio) }} (Stock: {{ p.stock }})
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="cliente_nombre">👤 Nombre del Cliente *</label>
            <input type="text" id="cliente_nombre" name="cliente_nombre" required
                placeholder="Ej: Juan Pérez">
        </div>

        <div class="form-group">
            <label for="cliente_email">📧 Email del Cliente</label>
            <input type="email" id="cliente_email" name="cliente_email"
                placeholder="Ej: juan@email.com">
        </div>
    </div>

    <div class="form-group">
        <label for="cantidad">📊 Cantidad *</label>
        <input type="number" id="cantidad" name="cantidad" min="1" required
            value="1" placeholder="1">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-save">🛒 Registrar Venta</button>
        <a href="{{ url_for('admin_ventas') }}" class="btn btn-cancel">❌ Cancelar</a>
    </div>
</form>
{% endblock %}
