{% extends "base.html" %}

{% block title %}Login - TechByte{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1>🔑 Acceso Administrador</h1>
        <p>Ingresa tus credenciales para acceder al panel de administración.</p>

        <form method="POST" action="{{ url_for('login') }}" class="crud-form">
            <div class="form-group">
                <label for="mail">📧 Correo Electrónico</label>
                <input type="email" id="mail" name="mail" required
                    placeholder="admin@techbyte.com">
            </div>

            <div class="form-group">
                <label for="password">🔒 Contraseña</label>
                <input type="password" id="password" name="password" required
                    placeholder="Tu contraseña">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-save">🔓 Iniciar Sesión</button>
            </div>
        </form>

        <p class="login-hint">
            <small>Credenciales por defecto: <strong>admin@techbyte.com</strong> / <strong>admin123</strong></small>
        </p>
    </div>
</div>
{% endblock %}
